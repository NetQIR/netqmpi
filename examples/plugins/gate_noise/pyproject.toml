# Makes this example an installable plugin package. After
#
#   pip install ./examples/plugins/gate_noise
#
# it is selected by its short name from any directory:
#
#   netqmpi -n 2 app.py --netqasm --plugin gate_noise --plugin-config params.yaml
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netqmpi-example-gate-noise"
version = "0.1.0"
description = "Example NetQMPI simulation plugin for the NetQASM backend"
requires-python = ">=3.8"
dependencies = ["netqmpi", "squidasm>=0.13,<0.14"]

[tool.setuptools]
py-modules = ["gate_noise"]

[project.entry-points."netqmpi.plugins"]
gate_noise = "gate_noise:gate_noise"
